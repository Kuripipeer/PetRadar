services:
  postgres:
    image: postgis/postgis:16-master
    container_name: PetRadarDB
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=petradar
    volumes:
      - petradar_data:/var/lib/postgresql/data

  redis:
    image: redis
    container_name: PetRadarRedis
    ports:
      - 6379:6379
    volumes:
      - petradar_redis:/data

volumes:
  petradar_data:
  petradar_redis: